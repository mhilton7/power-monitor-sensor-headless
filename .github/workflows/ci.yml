name: Firmware CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.15'
          cache: pip
      - name: Install pinned host contract validator
        run: python -m pip install --disable-pip-version-check --require-hashes -r test/host/requirements.txt
      - name: Python model, fault matrix, and 120-day simulation
        run: python tools/run_host_tests.py
      - name: Compile and run production pure-C unit tests
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -Itest/host/stubs -Icomponents/pm_meter/include -Icomponents/pm_measurement/include
          -Icomponents/pm_storage/include -Icomponents/pm_config/include -Icomponents/pm_protocol/include
          test/host/test_core.c components/pm_meter/pm_meter_pzem_v4_classic.c
          components/pm_measurement/pm_measurement.c components/pm_storage/pm_journal.c
          components/pm_config/pm_state.c
          -o "$RUNNER_TEMP/test_core" && "$RUNNER_TEMP/test_core"
      - name: Run production pure-C tests under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: >-
          cc -std=c11 -O1 -g -Wall -Wextra -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer
          -Itest/host/stubs -Icomponents/pm_meter/include -Icomponents/pm_measurement/include
          -Icomponents/pm_storage/include -Icomponents/pm_config/include -Icomponents/pm_protocol/include
          test/host/test_core.c components/pm_meter/pm_meter_pzem_v4_classic.c
          components/pm_measurement/pm_measurement.c components/pm_storage/pm_journal.c
          components/pm_config/pm_state.c
          -o "$RUNNER_TEMP/test_core_sanitized" && "$RUNNER_TEMP/test_core_sanitized"

  esp-idf-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify pinned framework
        shell: bash
        run: |
          test "$(git -C "$IDF_PATH" describe --tags --exact-match)" = v6.0.2
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = 7101770dc6db2667b3c477cc31365dd1acd6db4e
      - name: Validate release validators in pinned ESP-IDF Python
        run: >-
          /opt/esp/entrypoint.sh python -m pip install --disable-pip-version-check
          --require-hashes -r test/host/requirements.txt
      - name: Release-candidate build
        run: >-
          /opt/esp/entrypoint.sh idf.py -B build-ci -D 'SDKCONFIG=build-ci/sdkconfig'
          -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.release-candidate'
          set-target esp32s3 build
      - name: Enforce OTA slot margin
        run: test "$(stat -c %s build-ci/power-monitor-sensor-headless.bin)" -lt 7077888
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-ci-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build-ci/power-monitor-sensor-headless.bin
            build-ci/power-monitor-sensor-headless.elf
            build-ci/power-monitor-sensor-headless.map
            build-ci/bootloader/bootloader.bin
            build-ci/partition_table/partition-table.bin
            build-ci/ota_data_initial.bin

  powershell-contract:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse all PowerShell tooling
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem tools -File | Where-Object Extension -In @('.ps1', '.psm1') | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$fileErrors
            )
            $allErrors += $fileErrors
          }
          if ($allErrors.Count) { $allErrors | Format-List; exit 1 }
