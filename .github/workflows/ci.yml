name: Firmware CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.15'
          cache: pip
      - name: Install pinned host contract validator
        run: python -m pip install --disable-pip-version-check --require-hashes -r test/host/requirements.txt
      - name: Python model, fault matrix, and 120-day simulation
        run: python tools/run_host_tests.py
      - name: Compile and run unbuilt legacy journal regression evidence
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -Itest/host/stubs -Icomponents/pm_meter/include -Icomponents/pm_measurement/include
          -Icomponents/pm_storage/include -Icomponents/pm_config/include -Icomponents/pm_protocol/include
          test/host/test_core.c components/pm_meter/pm_meter_pzem_v4_classic.c
          components/pm_measurement/pm_measurement.c components/pm_storage/pm_journal.c
          components/pm_config/pm_state.c
          -o "$RUNNER_TEMP/test_core" && "$RUNNER_TEMP/test_core"
      - name: Compile and run physical PZEM admission and UART regression
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -Itest/host/stubs -Icomponents/pm_meter/include -Icomponents/pm_config/include
          test/host/test_pm_meter_io.c components/pm_meter/pm_meter.c
          components/pm_meter/pm_meter_pzem_v4_classic.c
          -o "$RUNNER_TEMP/test_pm_meter_io" && "$RUNNER_TEMP/test_pm_meter_io"
      - name: Compile and run command-ledger A/B recovery regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Wframe-larger-than=3072 \
          -Itest/host/stubs -Icomponents/pm_commands/include -Icomponents/pm_config/include \
          -Icomponents/pm_protocol/include -c components/pm_commands/pm_commands.c \
          -o "$RUNNER_TEMP/pm_commands.o"
          cc -std=c11 -Wall -Wextra -Werror \
          -Itest/host/stubs -Icomponents/pm_commands/include -Icomponents/pm_config/include \
          -Icomponents/pm_protocol/include test/host/test_pm_commands.c "$RUNNER_TEMP/pm_commands.o" \
          -o "$RUNNER_TEMP/test_pm_commands" && "$RUNNER_TEMP/test_pm_commands"
      - name: Compile and run configuration transaction regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Wframe-larger-than=3072 \
          -Itest/host/stubs -Icomponents/pm_config/include -Icomponents/pm_protocol/include \
          -c components/pm_config/pm_config.c -o "$RUNNER_TEMP/pm_config.o"
          cc -std=c11 -Wall -Wextra -Werror \
          -Itest/host/stubs -Icomponents/pm_config/include -Icomponents/pm_protocol/include \
          test/host/test_pm_config.c "$RUNNER_TEMP/pm_config.o" \
          -o "$RUNNER_TEMP/test_pm_config" && "$RUNNER_TEMP/test_pm_config"
      - name: Compile and run atomic runtime task-start regression
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -Itest/host/stubs -Imain
          test/host/test_runtime_startup.c main/runtime_startup.c
          -o "$RUNNER_TEMP/test_runtime_startup" && "$RUNNER_TEMP/test_runtime_startup"
      - name: Compile and run authenticated HTTP response and OTA policy regressions
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Itest/host/stubs -Icomponents/pm_protocol/include \
            test/host/test_pm_http_response.c components/pm_protocol/pm_http_response.c \
            -o "$RUNNER_TEMP/test_pm_http_response"
          "$RUNNER_TEMP/test_pm_http_response"
          cc -std=c11 -Wall -Wextra -Werror \
            -Itest/host/stubs -Icomponents/pm_ota/include -Icomponents/pm_network/include \
            test/host/test_pm_ota_policy.c components/pm_ota/pm_ota_version.c \
            components/pm_network/pm_command_envelope.c -o "$RUNNER_TEMP/test_pm_ota_policy"
          "$RUNNER_TEMP/test_pm_ota_policy"
          cc -std=c11 -Wall -Wextra -Werror \
            -Itest/host/stubs -Icomponents/pm_config/include -Icomponents/pm_meter/include \
            -Icomponents/pm_telemetry/include test/host/test_pm_telemetry.c \
            components/pm_telemetry/pm_telemetry.c -o "$RUNNER_TEMP/test_pm_telemetry"
          "$RUNNER_TEMP/test_pm_telemetry"
      - name: Compile and run unbuilt legacy backlog policy evidence
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/pm_network/include \
            test/host/test_pm_backlog_policy.c components/pm_network/pm_backlog_policy.c \
            -o "$RUNNER_TEMP/test_pm_backlog_policy"
          "$RUNNER_TEMP/test_pm_backlog_policy"
      - name: Run unbuilt legacy journal evidence under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: >-
          cc -std=c11 -O1 -g -Wall -Wextra -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer
          -Itest/host/stubs -Icomponents/pm_meter/include -Icomponents/pm_measurement/include
          -Icomponents/pm_storage/include -Icomponents/pm_config/include -Icomponents/pm_protocol/include
          test/host/test_core.c components/pm_meter/pm_meter_pzem_v4_classic.c
          components/pm_measurement/pm_measurement.c components/pm_storage/pm_journal.c
          components/pm_config/pm_state.c
          -o "$RUNNER_TEMP/test_core_sanitized" && "$RUNNER_TEMP/test_core_sanitized"
      - name: Run PZEM admission and UART regression under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: >-
          cc -std=c11 -O1 -g -Wall -Wextra -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer
          -Itest/host/stubs -Icomponents/pm_meter/include -Icomponents/pm_config/include
          test/host/test_pm_meter_io.c components/pm_meter/pm_meter.c
          components/pm_meter/pm_meter_pzem_v4_classic.c
          -o "$RUNNER_TEMP/test_pm_meter_io_sanitized" && "$RUNNER_TEMP/test_pm_meter_io_sanitized"
      - name: Run unbuilt legacy backlog evidence under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: >-
          cc -std=c11 -O1 -g -Wall -Wextra -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer
          -Icomponents/pm_network/include
          test/host/test_pm_backlog_policy.c components/pm_network/pm_backlog_policy.c
          -o "$RUNNER_TEMP/test_pm_backlog_policy_sanitized" &&
          "$RUNNER_TEMP/test_pm_backlog_policy_sanitized"
      - name: Run active stateless telemetry policy under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: >-
          cc -std=c11 -O1 -g -Wall -Wextra -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer
          -Itest/host/stubs -Icomponents/pm_config/include -Icomponents/pm_meter/include
          -Icomponents/pm_telemetry/include test/host/test_pm_telemetry.c
          components/pm_telemetry/pm_telemetry.c
          -o "$RUNNER_TEMP/test_pm_telemetry_sanitized" &&
          "$RUNNER_TEMP/test_pm_telemetry_sanitized"

  esp-idf-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned framework
        shell: bash
        run: |
          test "$(git -C "$IDF_PATH" describe --tags --exact-match)" = v6.0.2
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = 7101770dc6db2667b3c477cc31365dd1acd6db4e
      - name: Validate release validators in pinned ESP-IDF Python
        run: >-
          /opt/esp/entrypoint.sh python -m pip install --disable-pip-version-check
          --require-hashes -r test/host/requirements.txt
      - name: Release-candidate build
        run: >-
          /opt/esp/entrypoint.sh idf.py -B build-ci -D 'SDKCONFIG=build-ci/sdkconfig'
          -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.release-candidate'
          set-target esp32s3 build
      - name: Verify compiled PZEM and timing profile
        run: >-
          /opt/esp/entrypoint.sh python tools/verify_firmware_profile.py
          --sdkconfig-header build-ci/config/sdkconfig.h --profile release-candidate
      - name: Compile and run provisioning state-machine regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Wframe-larger-than=3072 \
          -Itest/host/stubs -Icomponents/pm_provisioning/include -Icomponents/pm_config/include \
          -Icomponents/pm_protocol/include -Imanaged_components/espressif__cjson/cJSON \
          -c components/pm_provisioning/pm_provisioning.c -o /tmp/pm_provisioning.o
          cc -std=c11 -Wall -Wextra -Werror \
          -Itest/host/stubs -Icomponents/pm_provisioning/include -Icomponents/pm_config/include \
          -Icomponents/pm_protocol/include -Imanaged_components/espressif__cjson/cJSON \
          test/host/test_pm_provisioning.c managed_components/espressif__cjson/cJSON/cJSON.c \
          /tmp/pm_provisioning.o -o /tmp/test_pm_provisioning
          /tmp/test_pm_provisioning
      - name: Enforce OTA slot margin
        run: test "$(stat -c %s build-ci/power-monitor-sensor-headless.bin)" -lt 7077888
      - name: Audit every first-party object stack frame
        run: >-
          python tools/audit_stack_frames.py --build-dir build-ci
          --json build-ci/stack-frame-audit.json --threshold 3072
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-ci-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build-ci/power-monitor-sensor-headless.bin
            build-ci/power-monitor-sensor-headless.elf
            build-ci/power-monitor-sensor-headless.map
            build-ci/stack-frame-audit.json
            build-ci/bootloader/bootloader.bin
            build-ci/partition_table/partition-table.bin
            build-ci/ota_data_initial.bin

  powershell-contract:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse all PowerShell tooling
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem tools -File | Where-Object Extension -In @('.ps1', '.psm1') | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$fileErrors
            )
            $allErrors += $fileErrors
          }
          if ($allErrors.Count) { $allErrors | Format-List; exit 1 }
      - name: Run provisioning UX regression
        shell: pwsh
        run: ./test/powershell/ProvisioningUx.Tests.ps1
